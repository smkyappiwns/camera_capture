<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Capture to n8n</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
    }
    video {
      width: 320px;
      height: 240px;
      border: 2px solid #444;
      border-radius: 10px;
    }
    canvas {
      display: none;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #0b7dda;
    }
  </style>
</head>
<body>
  <h2>📷 Capture Face & Send to n8n</h2>

  <video id="video" autoplay playsinline></video>
  <br />
  <button id="captureBtn">📸 Capture & Send</button>

  <canvas id="canvas"></canvas>

  <p id="status"></p>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    // ✅ Minta izin kamera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusText.textContent = "Camera active ✅";
      } catch (err) {
        console.error(err);
        statusText.textContent = "Camera access denied ❌";
      }
    }

    // 📸 Ambil snapshot dan kirim ke n8n
    async function captureAndSend() {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg');
      statusText.textContent = "Sending to n8n...";

      // 🧭 Ganti URL berikut dengan URL Webhook n8n kamu
      const n8nWebhookUrl = "https://n8n.smkyappi-wns.sch.id/webhook-test/face-capture";

      try {
        const res = await fetch(n8nWebhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64Data }),
        });

        const result = await res.json();
        statusText.textContent = "✅ Sent successfully! Response: " + JSON.stringify(result);
      } catch (e) {
        console.error(e);
        statusText.textContent = "❌ Failed to send to n8n.";
      }
    }

    document.getElementById('captureBtn').addEventListener('click', captureAndSend);
    initCamera();
  </script>
</body>
</html>
