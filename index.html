<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Kamera + Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
    }

    video {
      width: 320px;
      height: 240px;
      border: 2px solid #444;
      border-radius: 10px;
      margin-top: 10px;
    }

    canvas {
      display: none;
    }

    input {
      padding: 10px;
      width: 250px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0b7dda;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>📷 Capture + Kirim ke n8n</h2>

  <!-- FORM LOGIN -->
  <div>
    <input type="text" id="username" placeholder="Username" />
    <br />
    <input type="password" id="password" placeholder="Password" />
  </div>

  <!-- VIDEO -->
  <video id="video" autoplay playsinline></video>
  <br />

  <!-- BUTTON -->
  <button id="captureBtn">📸 Ambil & Kirim</button>

  <!-- CANVAS -->
  <canvas id="canvas"></canvas>

  <p id="status"></p>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // 🔹 Inisialisasi kamera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusText.textContent = "Camera active ✅";
      } catch (err) {
        console.error(err);
        statusText.textContent = "Camera access denied ❌";
      }
    }

    // 🔹 Capture + kirim
    async function captureAndSend() {
      const username = usernameInput.value;
      const password = passwordInput.value;

      if (!username || !password) {
        statusText.textContent = "⚠️ Username & password wajib diisi!";
        return;
      }

      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg');

      const timestamp = new Date().toISOString();

      statusText.textContent = "Sending to n8n...";

      const n8nWebhookUrl = "https://n8n.smkyappi-wns.sch.id/webhook-test/face-capture";

      try {
        const res = await fetch(n8nWebhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: base64Data,
            username: username,
            password: password,
            timestamp: timestamp
          }),
        });

        const result = await res.json();

        statusText.textContent = "✅ Berhasil dikirim!";
        console.log("Response:", result);

      } catch (e) {
        console.error(e);
        statusText.textContent = "❌ Gagal mengirim ke n8n";
      }
    }

    document.getElementById('captureBtn').addEventListener('click', captureAndSend);

    // jalankan kamera
    initCamera();
  </script>

</body>
</html>
