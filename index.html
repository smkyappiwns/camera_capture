<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presensi</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4facfe;
      outline: none;
      box-shadow: 0 0 5px rgba(79,172,254,0.5);
    }

    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      background: #4facfe;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #2f80ed;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #444;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #4facfe;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">Presensi</div>
    <h2>Login & Capture</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Masukkan username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
    </div>

    <video id="video" autoplay playsinline></video>

    <button id="captureBtn">Submit Presensi</button>

    <canvas id="canvas"></canvas>
    <p id="status"></p>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusText.textContent = "Camera active ✅";
      } catch (err) {
        console.error(err);
        statusText.textContent = "Camera access denied ❌";
      }
    }

    async function captureAndSend() {
      const username = usernameInput.value;
      const password = passwordInput.value;

      if (!username || !password) {
        statusText.textContent = "⚠️ Username & password wajib diisi!";
        return;
      }

      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg');
      const timestamp = new Date().toISOString();
      const userAgent = navigator.userAgent;
      statusText.textContent = "Sending...";

      try {
        const res = await fetch("https://n8n.smkyappi-wns.sch.id/webhook-test/face-capture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: base64Data,
            username: username,
            password: password,
            timestamp: timestamp,
            user_agent: userAgent
          }),
        });

        const result = await res.json();

        statusText.textContent = "✅ Presensi Berhasil!";
        console.log(result);

      } catch (e) {
        console.error(e);
        statusText.textContent = "❌ Gagal Presensi";
      }
    }

    document.getElementById('captureBtn').addEventListener('click', captureAndSend);

    initCamera();
  </script>

</body>
</html>
